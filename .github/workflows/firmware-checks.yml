name: FIRE firmware checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['M5Stack-device/**', '.github/workflows/firmware-checks.yml']
  pull_request:
    paths: ['M5Stack-device/**', '.github/workflows/firmware-checks.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0 cryptography==50.0.2
      - name: Verify shared App SDK contract and generated flash data
        run: python M5Stack-backend/scripts/build_app_sdk.py --check
      - name: Verify optional Runtime AI contract and generated constants
        run: python M5Stack-backend/scripts/build_runtime_ai_contract.py --check
      - name: Verify OS-only antialiased fonts and icons
        run: python M5Stack-device/tools/build_ui_antialias.py --check
      - name: Native guards and release tests
        run: |
          python -m unittest discover -s M5Stack-device/tests -p 'test_*.py' -v
      - name: Render actual OS and Home drawing helpers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -IM5Stack-device/src M5Stack-device/tests/native_ui_preview.cpp -o "$RUNNER_TEMP/fire-ui-preview"
          mkdir -p "$RUNNER_TEMP/fire-ui-preview-images"
          cd "$RUNNER_TEMP/fire-ui-preview-images"
          "$RUNNER_TEMP/fire-ui-preview"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fire-ui-preview-${{ github.sha }}
          path: ${{ runner.temp }}/fire-ui-preview-images/*.ppm
          if-no-files-found: error
      - name: Normal firmware with Bluetooth and audio
        run: pio run --project-dir M5Stack-device -e m5stack-fire-ble
      - name: Independent factory recovery
        run: pio run --project-dir M5Stack-device -e fire-recovery
      - name: Button-aware rollback bootloader
        run: pio run --project-dir M5Stack-device/recovery/bootloader
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fire-unsigned-${{ github.sha }}
          if-no-files-found: error
          # Only the explicit build outputs below; never .secrets or runtime data.
          include-hidden-files: true
          path: |
            M5Stack-device/.pio/build/*/firmware.bin
            M5Stack-device/.pio/build/*/firmware.elf
            M5Stack-device/.pio/build/*/firmware.map
            M5Stack-device/.pio/build/*/partitions.bin
            M5Stack-device/recovery/bootloader/.pio/build/*/bootloader.bin
            M5Stack-device/recovery/bootloader/.pio/build/*/bootloader.elf
            M5Stack-device/recovery/bootloader/.pio/build/*/partitions.bin
            M5Stack-device/recovery/bootloader/sdkconfig.*
