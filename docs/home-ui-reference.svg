<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" viewBox="0 0 660 280">
<title>Home visual reference — dashboard and climate detail</title>
<desc>Design reference, not a device screenshot. Each panel is 320 by 240 pixels. Native cards, readable text, explicit focus and status.</desc>
<defs>
 <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e9f2f8} .muted{fill:#a7b7c5} .small{font-size:11px} .label{font-size:13px;font-weight:600} .value{font-size:21px;font-weight:600}</style>
 <symbol id="bulb" viewBox="0 0 24 24"><path d="M8 16c0-3-3-3-3-8a7 7 0 0 1 14 0c0 5-3 5-3 8M8 18h8M10 21h4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
 <symbol id="thermo" viewBox="0 0 24 24"><path d="M9 14V5a3 3 0 0 1 6 0v9a6 6 0 1 1-6 0zM12 6v12" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</defs>
<rect width="660" height="280" fill="#050c12"/>
<text x="10" y="18" class="small muted">DESIGNREFERANSE · ikke enhetsskjermbilde</text>
<g transform="translate(0 30)">
 <rect width="320" height="240" rx="10" fill="#0d1721"/>
 <text x="12" y="25" font-size="19" font-weight="600">Home</text>
 <rect x="83" y="8" width="68" height="23" rx="11" fill="#243442"/><text x="96" y="24" class="small">Hjem</text>
 <circle cx="245" cy="20" r="3" fill="#66d0bd"/><text x="254" y="24" class="small muted">Lokalt</text>
 <rect x="12" y="43" width="142" height="76" rx="9" fill="#192b39" stroke="#70d8ec" stroke-width="2"/>
 <use href="#bulb" x="23" y="54" width="22" height="22" color="#f2c46b"/>
 <text x="54" y="68" class="label">Lys</text><text x="24" y="99" class="value">På</text><text x="83" y="98" class="small muted">65 %</text>
 <rect x="166" y="43" width="142" height="76" rx="9" fill="#172632"/>
 <use href="#thermo" x="177" y="54" width="22" height="22" color="#f2b383"/>
 <text x="208" y="68" class="label">Varme</text><text x="178" y="99" class="value">21,4°</text><text x="250" y="99" class="small muted">Mål 22°</text>
 <rect x="12" y="131" width="142" height="76" rx="9" fill="#172632"/>
 <path d="M25 153l4-10 6 5 6-5 4 10v11H25z" fill="none" stroke="#a7b7c5" stroke-width="1.7"/><text x="54" y="156" class="label">Kattedo</text>
 <text x="24" y="187" class="value">Klar</text><circle cx="133" cy="181" r="4" fill="#66d0bd"/>
 <rect x="166" y="131" width="142" height="76" rx="9" fill="#172632"/>
 <use href="#thermo" x="177" y="142" width="22" height="22" color="#70d8ec"/><text x="208" y="156" class="label">Ute</text><text x="178" y="187" class="value">6,8°</text>
 <text x="13" y="231" class="small muted">A Forrige</text><text x="126" y="231" class="small">B Åpne</text><text x="251" y="231" class="small muted">C Neste</text>
</g>
<g transform="translate(340 30)">
 <rect width="320" height="240" rx="10" fill="#0d1721"/>
 <text x="14" y="25" font-size="19" font-weight="600">Varme · Stue</text><circle cx="249" cy="20" r="3" fill="#66d0bd"/><text x="258" y="24" class="small muted">Oppdatert</text>
 <text x="160" y="60" text-anchor="middle" class="label muted">Ønsket temperatur</text>
 <text x="160" y="111" text-anchor="middle" font-size="45" font-weight="600">22,0°</text>
 <rect x="36" y="132" width="248" height="8" rx="4" fill="#2b3e4c"/><rect x="36" y="132" width="161" height="8" rx="4" fill="#70d8ec"/><circle cx="197" cy="136" r="8" fill="#e9f2f8"/>
 <text x="36" y="162" class="small muted">5°</text><text x="268" y="162" class="small muted">30°</text>
 <rect x="36" y="177" width="248" height="28" rx="8" fill="#172632"/>
 <text x="50" y="196" class="small muted">Nå 21,4°</text><text x="194" y="196" class="small">Oppvarming</text>
 <text x="13" y="231" class="small muted">A Lavere</text><text x="117" y="231" class="small">B Bekreft</text><text x="251" y="231" class="small muted">C Høyere</text>
</g>
</svg>
