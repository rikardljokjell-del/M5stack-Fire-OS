; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-fire-ble

[env:m5stack-fire]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
extra_scripts = pre:tools/guard_upload.py
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = recovery/partitions.csv
board_build.embed_files = certs/roots.bundle
board_build.embed_txtfiles = certs/release-public.pem
build_src_filter = +<*> -<recovery_main.cpp> -<rescue.cpp> -<ble_legacy_poc.cpp> -<external_loader_poc.cpp> -<external_app_test.cpp>
lib_deps = 
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0

[env:m5stack-fire-ble-legacy-poc]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
build_src_filter = +<ble_legacy_poc.cpp> -<main.cpp> -<fire_os.cpp>
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0

	h2zero/NimBLE-Arduino @ 2.5.2

[env:m5stack-fire-ble]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
extra_scripts = pre:tools/guard_upload.py
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = recovery/partitions.csv
board_build.embed_files = certs/roots.bundle
board_build.embed_txtfiles = certs/release-public.pem
build_src_filter = +<*> -<recovery_main.cpp> -<rescue.cpp> -<ble_legacy_poc.cpp> -<external_loader_poc.cpp> -<external_app_test.cpp>
build_flags =
	-D FIRE_OS_BLE=1
	-D FIRE_AUDIO_CAPTURE_ENABLED=1
	-D LUA_32BITS=1
	-D LUA_USE_C89=1
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0
	h2zero/NimBLE-Arduino @ 2.5.2

[env:m5stack-fire-external-loader-poc]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = poc/partitions_external_loader.csv
build_src_filter = -<*> +<external_loader_poc.cpp>
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0

[env:m5stack-fire-external-app-test]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = poc/partitions_external_loader.csv
build_src_filter = -<*> +<external_app_test.cpp>
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0

[env:m5stack-fire-rescue]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<rescue.cpp>
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0

[env:fire-recovery]
platform = espressif32@6.6.0
board = m5stack-fire
framework = arduino
extra_scripts = pre:tools/guard_upload.py
monitor_speed = 115200
board_build.partitions = recovery/partitions.csv
board_build.embed_files = certs/roots.bundle
board_build.embed_txtfiles = certs/release-public.pem
build_src_filter = -<*> +<recovery_main.cpp> +<fire_async_client.cpp> +<fire_release.cpp> +<fire_ota.cpp>
lib_deps =
	m5stack/M5Unified @ 0.2.29
	m5stack/M5GFX @ 0.3.0
